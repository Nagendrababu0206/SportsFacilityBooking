<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="520" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="240" width="800" height="280" fill="url(#grass)"/>
  <!-- Field markings -->
  <rect x="80" y="260" width="640" height="240" fill="none" stroke="#fff" stroke-width="2.5" rx="4"/>
  <!-- Center line -->
  <line x1="400" y1="260" x2="400" y2="500" stroke="#fff" stroke-width="2"/>
  <!-- Center circle -->
  <circle cx="400" cy="380" r="50" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="400" cy="380" r="4" fill="#fff"/>
  <!-- Goals -->
  <rect x="80" y="340" width="50" height="80" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="80" y="360" width="25" height="40" fill="none" stroke="#fff" stroke-width="1.5"/>
  <rect x="670" y="340" width="50" height="80" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="695" y="360" width="25" height="40" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Corner arcs -->
  <path d="M80 270 Q90 270 90 280" fill="none" stroke="#fff" stroke-width="1.5"/>
  <path d="M720 270 Q710 270 710 280" fill="none" stroke="#fff" stroke-width="1.5"/>
  <path d="M80 490 Q90 490 90 480" fill="none" stroke="#fff" stroke-width="1.5"/>
  <path d="M720 490 Q710 490 710 480" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Football -->
  <circle cx="400" cy="380" r="14" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <polygon points="400,368 407,374 405,382 395,382 393,374" fill="#333"/>
  <!-- Floodlights -->
  <rect x="30" y="60" width="6" height="180" fill="#666"/>
  <circle cx="33" cy="55" r="12" fill="#ffd700" filter="url(#glow)" opacity="0.8"/>
  <rect x="764" y="60" width="6" height="180" fill="#666"/>
  <circle cx="767" cy="55" r="12" fill="#ffd700" filter="url(#glow)" opacity="0.8"/>
  <!-- Text -->
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff" opacity="0.9">⚽ Football Ground</text>
</svg>
